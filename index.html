body {
        background-color: #000;
        color: #fff;
        font-family: sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
        box-sizing: border-box;
        gap: 20px;
    }

    header { text-align: center; margin-bottom: 10px; }
    h1 { margin-bottom: 20px; text-align: center; }

    /* Контейнер со стрелками */
    .editor-container {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 20px;
        width: 100%;
        max-width: 600px;
    }

    /* Стрелочки */
    .nav-arrow {
        background: #1a1a1a;
        color: #fff;
        border: 1px solid #333;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        font-size: 20px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.2s;
        flex-shrink: 0;
        z-index: 10;
    }
    .nav-arrow:hover { background: #333; }

    .desktop-menu { display: none; } 
    @media (min-width: 1024px) {
        .desktop-menu {
            display: flex;
            flex-direction: column;
            gap: 15px;
            position: fixed;
            right: 30px;
            top: 50%;
            transform: translateY(-50%);
            background: #111;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #333;
            width: 220px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .desktop-menu h3 { margin: 0 0 10px 0; text-align: center; font-size: 16px; color: #ccc; }
        .menu-btn {
            background: #2a2a2a; color: #fff; border: 1px solid #444;
            padding: 10px 15px; border-radius: 6px; cursor: pointer;
            text-align: left; font-size: 14px; transition: all 0.2s;
        }
        .menu-btn:hover { background: #3a3a3a; border-color: #666; }
    }

    /* Курсор для кликабельных элементов */
    .label, .label-two, #status-text, #type-text, #direction-text { cursor: pointer; }

    /* Кнопка скачать */
    .save-btn {
        background-color: #4F46E5; color: white; border: none;
        padding: 12px 24px; border-radius: 8px; cursor: pointer;
        margin-top: 20px; font-size: 1rem; display: flex;
        align-items: center; gap: 8px; z-index: 10;
    }

    .spinner {
        width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3);
        border-radius: 50%; border-top-color: #fff;
        animation: spin 1s ease-in-out infinite; display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #toast {
        display: none; position: fixed; bottom: 20px; left: 50%;
        transform: translateX(-50%); background: #4F46E5;
        padding: 10px 20px; border-radius: 8px; transition: opacity 0.5s;
    }

    /* === ОСНОВНОЙ БЛОК (БЕЗ ДУБЛЕЙ) === */
    #capture-block {
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        position: relative;
        overflow: hidden; 
        z-index: 1;
        height: 320px;
        width: 320px;
        background-color: black;
        border: 1px solid #333;
    }

        .block-image {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover; 
        z-index: 0;
        display: block;
    }

    /* Логотип (Поверх фона) */
    .logo-image {
        height: 24px;
        width: 76px;
        background-image: url("img/logo.png");
        background-size: contain;
        background-repeat: no-repeat;
        margin: 10px;
        z-index: 2;
        position: relative;
    }

    /* Информация о сделке (Поверх фона) */
    .order-info {
        z-index: 2;
        padding: 10px;
        font-family: "Rubik", sans-serif;
        position: absolute;
        top: 60px;
        left: 0;
        right: 0;
        bottom: 0;
    }

    /* === ИСПРАВЛЕНИЕ QR-КОДА === */
    .invite-qr-code-wrapper-small {
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .img_ref {
        width: 100%;
        height: 100%;
        object-fit: contain; 
    }

        function handleImageUpload(input, imgElement) {
            input.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(ev) { imgElement.src = ev.target.result; };
                    reader.readAsDataURL(file);
                }
                this.value = '';
            });
        }
        handleImageUpload(fileInputAvatar, avatarImg);
        handleImageUpload(fileInputQr, qrImg);

        const blockToCapture = document.getElementById('capture-block');
        const saveBtn = document.getElementById('save-btn');
        const btnText = document.getElementById('btn-text');
        const spinner = document.getElementById('spinner');
        const toast = document.getElementById('toast');

        const lastPriceEl = document.getElementById('last-price');
        const entryPriceEl = document.getElementById('entry-price');
        const multiplierEl = document.getElementById('multiplier');
        const profitTextEl = document.getElementById('profit-text');
        const directionTextEl = document.getElementById('direction-text');

        function parseNumber(str) {
                if (!str) return 0;
                return parseFloat(str.toString().replace(/\s/g, '').replace(',', '.')) || 0;

            function calculateProfit() {
                const lastPrice = parseNumber(lastPriceEl.textContent);
                const entryPrice = parseNumber(entryPriceEl.textContent);
                const multiplier = parseNumber(multiplierEl.textContent);
                const isShort = directionTextEl.textContent.trim() === 'Шорт';

                let rawProfit = 0;

                if (entryPrice !== 0) {
                    let priceChangePercent = ((lastPrice - entryPrice) / entryPrice) * 100;

                    if (isShort) {
                        priceChangePercent = -priceChangePercent;
                    }

                    rawProfit = priceChangePercent * multiplier;
                }

                let finalProfit = rawProfit.toFixed(2);

                if (finalProfit > 0) {
                    finalProfit = "+" + finalProfit;
                }

                profitTextEl.textContent = finalProfit + "%";

                adjustFontSize();
                updateProfitState(parseFloat(finalProfit));
            }

        function adjustFontSize() {
            let length = profitTextEl.textContent.trim().length;
            if (length > 18) {
                profitTextEl.style.fontSize = '20px';
                profitTextEl.style.lineHeight = '20px';
            } else if (length > 14) {
                profitTextEl.style.fontSize = '24px';
                profitTextEl.style.lineHeight = '24px';
            } else if (length > 11) {
                profitTextEl.style.fontSize = '28px';
                profitTextEl.style.lineHeight = '28px';
            } else {
                profitTextEl.style.fontSize = '36px'; 
                profitTextEl.style.lineHeight = '36px';
            }
        }

       function updateProfitState(number) {
            if (isNaN(number)) return;
            profitTextEl.classList.remove('down', 'up');
            
            if (number < 0) {
                profitTextEl.classList.add('down');
                blockImage.src = redImages[currentStyleIndex];
            } else {
                profitTextEl.classList.add('up');  
                blockImage.src = greenImages[currentStyleIndex];
            }
        }

        lastPriceEl.addEventListener('input', calculateProfit);
        entryPriceEl.addEventListener('input', calculateProfit);
        multiplierEl.addEventListener('input', calculateProfit);

        directionTextEl.addEventListener('click', () => {
            if (directionTextEl.textContent.trim() === 'Шорт') {
                directionTextEl.textContent = 'Лонг';
                directionTextEl.classList.remove('down');
                directionTextEl.classList.add('up');
            } else {
                directionTextEl.textContent = 'Шорт';
                directionTextEl.classList.remove('up');
                directionTextEl.classList.add('down');
            }
            calculateProfit(); 
        });

        document.addEventListener('DOMContentLoaded', () => {
            const statusText = document.getElementById('status-text');
            statusText.addEventListener('click', () => {
                statusText.textContent = statusText.textContent.trim() === 'Нереализованная П/У' ? 'Реализованная П/У' : 'Нереализованная П/У';
            });
            
            const TypeText = document.getElementById('type-text');
            TypeText.addEventListener('click', () => {
                TypeText.textContent = TypeText.textContent.trim() === 'Доходность' ? 'Прибыль' : 'Доходность';
            });

            // Смена "Последняя цена" -> "Цена закрытия"
            priceLabel.addEventListener('click', () => {
                priceLabel.textContent = priceLabel.textContent.trim() === 'Последняя цена' ? 'Цена закрытия' : 'Последняя цена';
            });

            calculateProfit();
        });

        function showToast(message) {
            toast.textContent = message;
            toast.style.display = "block";
            toast.style.opacity = 1;
            setTimeout(() => {
                toast.style.opacity = 0;
                setTimeout(() => toast.style.display = "none", 500);
            }, 3000);
        }

        saveBtn.addEventListener('click', () => {
            btnText.textContent = "Генерация...";
            spinner.style.display = "block";
            saveBtn.disabled = true;
            
            modernScreenshot.domToPng(blockToCapture, {
                scale: 3,
                backgroundColor: "#000000",
                quality: 1,
            }).then(dataUrl => {
                const link = document.createElement('a');
                link.download = `template-${new Date().getTime()}.png`;
                link.href = dataUrl;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast("Блок успешно сохранен в фото!");
            }).catch(err => {
                console.error("Ошибка:", err);
                showToast("Ошибка при сохранении.");
            }).finally(() => {
                btnText.textContent = "Скачать изображение";
                spinner.style.display = "none";
                saveBtn.disabled = false;
            });
        });

        const nicknameInput = document.querySelector('.nickname[contenteditable="true"]');
        if (nicknameInput) {
            nicknameInput.addEventListener('keydown', function(event) {
                let text = this.innerText;
                const isControlKey = event.key.length > 1; 
                if (text.length >= 14 && !isControlKey) event.preventDefault(); 
            });
            nicknameInput.addEventListener('paste', function(event) {
                event.preventDefault(); 
                const pasteText = (event.clipboardData || window.clipboardData).getData('text');
                const currentText = this.innerText;
                const maxLength = 14;
                const remainingSpace = maxLength - currentText.length;
                if (remainingSpace > 0) {
                    document.execCommand('insertText', false, pasteText.substring(0, remainingSpace));
                }
            });
        }

        // === ЛОГИКА СТРЕЛОК И БОКОВОГО МЕНЮ ===

        // Функция для стрелок (меняет индекс дизайна и сразу обновляет фон)
        function changeBlockImage(direction) {
            currentStyleIndex = (currentStyleIndex + direction + greenImages.length) % greenImages.length;
            
            // Чтобы цвет оставался корректным при смене дизайна, вызываем расчет прибыли
            // Она сама перекрасит фон в нужный цвет с новым индексом
            calculateProfit(); 
        }

        document.getElementById('prev-img-btn').addEventListener('click', () => changeBlockImage(-1));
        document.getElementById('next-img-btn').addEventListener('click', () => changeBlockImage(1));

        document.querySelectorAll('.menu-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const action = btn.getAttribute('data-action');
                switch(action) {
                    case 'toggle-status':
                        document.getElementById('status-text').click();
                        break;
                    case 'toggle-direction':
                        directionTextEl.click();
                        break;
                    case 'toggle-type':
                        document.getElementById('type-text').click();
                        break;
                    case 'toggle-price-label':
                        priceLabel.click();
                        break;
                    case 'toggle-profit-color':
                        if (profitTextEl.classList.contains('down')) {
                            profitTextEl.classList.remove('down');
                            profitTextEl.classList.add('up');
                            blockImage.src = greenImages[currentStyleIndex]; 
                        } else {
                            profitTextEl.classList.remove('up');
                            profitTextEl.classList.add('down');
                            blockImage.src = redImages[currentStyleIndex];
                        }
                        break;
                        
                    case 'prev-image':
                        changeBlockImage(-1);
                        break;
                    case 'next-image':
                        changeBlockImage(1);
                        break;
                }
            });
        });
    </script>
</body>
</html>
